# Literature used by the code in this repository.
#
# Only this list is tracked in git. The PDFs themselves live in literature/pdf/, which is
# git-ignored: most of these papers are copyrighted by their publishers, and a public
# repository would redistribute them. Run `uv run scripts/sync_literature.py` to fill the
# folder on your own machine (see literature/README.md).
#
# Fields
#   key            BibTeX key in the thesis bibliography (literatur.bib); the PDF is stored as <key>.pdf
#   citation       short citation as used in the thesis
#   title          title of the work
#   doi / url      where the published version lives
#   open_pdf       direct PDF link that may be downloaded freely, or null
#   match          substrings that identify an existing local copy by file name (case-insensitive)
#   sha256         checksums of known local copies (identifies files with unhelpful names)
#   used_in        files in this repository that implement or rely on the work

sources:
  - key: cohen1972
    citation: Cohen, March & Olsen (1972)
    title: A Garbage Can Model of Organizational Choice
    doi: 10.2307/2392088
    url: https://www.jstor.org/stable/2392088
    open_pdf: null
    match: [cohen_olsen_1972, garbagecanmodeloforganizationalchoice]
    sha256: [2ca28a0b692dbee5ec5ef661b347d2cd6ee7dc90999634bf7ad03d33c7ae8fa6]
    used_in:
      - src/gcm/fortran/          # port of the FORTRAN listing "version five" (appendix)
      - src/gcm/fortran/data.py   # entry-time cards and solution coefficients
      - data/reference/GCM_Referenzdaten_CMO1972_Fioretti2008.xlsx
      - scripts/run_docking.py
    notes: JSTOR copy, personal use only. Tables 1 to 5 and the listing are the docking targets.

