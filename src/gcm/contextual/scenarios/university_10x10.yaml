# PLACEHOLDER: a university scenario for the FORTRAN port (exactly 10 participants and 10
# opportunities, as the paper's fixed parameters require). The texts are a first draft to be
# revised; the importance orders of both lists are modeling decisions and must be revised with
# the same care, because row order fixes the energy of a participant in the unequal energy
# distributions and column order fixes the entry period of an opportunity.
#
# Variants follow Cohen, March & Olsen (1972, p. 13, Figure 2): strong administrative power or
# strong interrelation of problems is expected to go with the hierarchical decision structure,
# moderate power with weak interrelation with the specialized one, and weak power with moderate
# interrelation with the unsegmented one. The `expected` field records that theoretical
# expectation for the conformity check; it is never rendered into a prompt.
id: university
kind: placeholder
row_entity: participant
languages: [en, de]
terms:
  participant:
    plural: {en: Members of the university, de: Mitglieder der Hochschule}
  opportunity:
    plural: {en: Bodies and committees, de: Gremien und Ausschüsse}
notes: >-
  Placeholder written for the pipeline test. Participant and opportunity lists, their order and
  the variant statements are to be revised by the author.
participants:
  - id: president
    rank: 1
    label: {en: the president, de: die Präsidentin}
    description:
      en: leads the university, represents it externally and chairs its central bodies
      de: leitet die Hochschule, vertritt sie nach außen und führt den Vorsitz in ihren zentralen Gremien
  - id: chancellor
    rank: 2
    label: {en: the chancellor, de: der Kanzler}
    description:
      en: heads the central administration and is responsible for the budget and the staff
      de: leitet die zentrale Verwaltung und ist für Haushalt und Personal verantwortlich
  - id: vice_president
    rank: 3
    label: {en: the vice president for studies, de: die Vizepräsidentin für Studium und Lehre}
    description:
      en: is responsible for degree programmes, examinations and quality of teaching across the university
      de: ist hochschulweit für Studiengänge, Prüfungen und die Qualität der Lehre zuständig
  - id: dean
    rank: 4
    label: {en: the dean, de: der Dekan}
    description:
      en: leads one faculty, chairs its council and represents it towards the university leadership
      de: leitet eine Fakultät, führt den Vorsitz in ihrem Rat und vertritt sie gegenüber der Hochschulleitung
  - id: full_professor
    rank: 5
    label: {en: the full professor, de: die Professorin}
    description:
      en: holds a chair in the faculty, teaches, supervises and leads a research group
      de: hat eine Professur in der Fakultät, lehrt, betreut und leitet eine Forschungsgruppe
  - id: junior_professor
    rank: 6
    label: {en: the junior professor, de: der Juniorprofessor}
    description:
      en: holds a fixed-term professorship, teaches and builds up a research group
      de: hat eine befristete Professur, lehrt und baut eine Forschungsgruppe auf
  - id: research_associate
    rank: 7
    label: {en: the research associate, de: die wissenschaftliche Mitarbeiterin}
    description:
      en: works on a doctorate, teaches a few courses and assists in research projects
      de: promoviert, lehrt einige Kurse und arbeitet in Forschungsprojekten mit
  - id: faculty_officer
    rank: 8
    label: {en: the faculty administrative officer, de: der Mitarbeiter der Fakultätsverwaltung}
    description:
      en: organizes examinations, timetables and records for the faculty
      de: organisiert Prüfungen, Stundenpläne und Akten für die Fakultät
  - id: student_representative
    rank: 9
    label: {en: the elected student representative, de: die gewählte Studierendenvertreterin}
    description:
      en: was elected by the students of the faculty to speak for them
      de: wurde von den Studierenden der Fakultät gewählt, um für sie zu sprechen
  - id: student
    rank: 10
    label: {en: the student, de: der Student}
    description:
      en: is enrolled in a bachelor programme of the faculty and holds no office
      de: ist in einem Bachelorstudiengang der Fakultät eingeschrieben und hat kein Amt
opportunities:
  - id: senate
    rank: 1
    label: {en: the senate, de: der Senat}
    description:
      en: decides on the statutes, the structure and the strategy of the whole university
      de: entscheidet über Satzungen, Struktur und Strategie der gesamten Hochschule
  - id: budget_planning
    rank: 2
    label: {en: the budget planning round, de: die Haushaltsplanungsrunde}
    description:
      en: allocates the university's funds to faculties and central units for the coming year
      de: verteilt die Mittel der Hochschule für das kommende Jahr auf Fakultäten und zentrale Einheiten
  - id: appointment_committee
    rank: 3
    label: {en: the appointment committee, de: die Berufungskommission}
    description:
      en: selects the candidate for a vacant professorship and proposes the appointment
      de: wählt die Kandidatin für eine freie Professur aus und schlägt die Berufung vor
  - id: faculty_council
    rank: 4
    label: {en: the faculty council, de: der Fakultätsrat}
    description:
      en: decides on the affairs of one faculty, including its study regulations and its development plan
      de: entscheidet über die Angelegenheiten einer Fakultät, darunter ihre Studienordnungen und ihren Entwicklungsplan
  - id: study_commission
    rank: 5
    label: {en: the study commission, de: die Studienkommission}
    description:
      en: prepares changes to degree programmes and advises the faculty council on teaching
      de: bereitet Änderungen an Studiengängen vor und berät den Fakultätsrat in Fragen der Lehre
  - id: examination_board
    rank: 6
    label: {en: the examination board, de: der Prüfungsausschuss}
    description:
      en: decides on examination matters of individual students, such as recognition of credits and appeals
      de: entscheidet über Prüfungsangelegenheiten einzelner Studierender, etwa Anerkennungen und Widersprüche
  - id: research_funding_round
    rank: 7
    label: {en: the internal research funding round, de: die interne Forschungsförderrunde}
    description:
      en: awards the faculty's small internal grants for research projects
      de: vergibt die kleinen internen Zuschüsse der Fakultät für Forschungsprojekte
  - id: module_revision
    rank: 8
    label: {en: the module revision working group, de: die Arbeitsgruppe zur Modulüberarbeitung}
    description:
      en: rewrites the descriptions of the modules of one degree programme
      de: überarbeitet die Beschreibungen der Module eines Studiengangs
  - id: lab_procurement
    rank: 9
    label: {en: the laboratory equipment procurement, de: die Beschaffung der Laborausstattung}
    description:
      en: chooses the equipment for a teaching laboratory within a fixed budget
      de: wählt die Ausstattung für ein Lehrlabor innerhalb eines festen Budgets aus
  - id: orientation_week
    rank: 10
    label: {en: the orientation week planning, de: die Planung der Orientierungswoche}
    description:
      en: plans the programme of the first week for new students
      de: plant das Programm der ersten Woche für neue Studierende
organization:
  en: >-
    The organization is a public university with several faculties. Its members hold different
    offices and positions, and its decisions are taken in bodies, committees and working rounds.
    The statements below describe how the university is run.
  de: >-
    Die Organisation ist eine staatliche Hochschule mit mehreren Fakultäten. Ihre Mitglieder
    haben unterschiedliche Ämter und Positionen, und ihre Entscheidungen fallen in Gremien,
    Ausschüssen und Arbeitsrunden. Die folgenden Aussagen beschreiben, wie die Hochschule
    geführt wird.
variants:
  - id: strong_power
    title:
      en: "University placeholder: strong administrative power, strong interrelation of problems"
      de: "Hochschul-Platzhalter: starke Verwaltungsmacht, stark verflochtene Probleme"
    factors: {administrative_power: strong, problem_interrelation: strong}
    expected: hierarchical
    statements:
      - en: >-
          The university leadership and the central administration hold substantial authority.
          Decisions of a body are binding only after the leadership has endorsed them, and the
          leadership regularly takes matters into its own hands.
        de: >-
          Hochschulleitung und zentrale Verwaltung haben erhebliche Befugnisse. Beschlüsse eines
          Gremiums sind erst bindend, wenn die Leitung sie gebilligt hat, und die Leitung zieht
          Angelegenheiten regelmäßig an sich.
      - en: >-
          Almost every question touches many others: funding, appointments, study programmes and
          examinations are treated as parts of one university-wide plan, so office holders of
          higher rank are involved wherever that plan is affected.
        de: >-
          Fast jede Frage berührt viele andere: Mittel, Berufungen, Studiengänge und Prüfungen
          gelten als Teile eines hochschulweiten Plans, sodass Amtsträger höheren Ranges überall
          beteiligt sind, wo dieser Plan betroffen ist.
      - en: >-
          Participation in a body depends on office and rank. Those with a higher office may take
          part in the bodies below their level; those without office take part only where the
          regulations provide a seat for them.
        de: >-
          Die Mitwirkung in einem Gremium richtet sich nach Amt und Rang. Wer ein höheres Amt hat,
          darf in den Gremien unterhalb seiner Ebene mitwirken; wer kein Amt hat, wirkt nur dort
          mit, wo die Ordnungen einen Sitz vorsehen.
  - id: moderate_power
    title:
      en: "University placeholder: moderate administrative power, weak interrelation of problems"
      de: "Hochschul-Platzhalter: mittlere Verwaltungsmacht, schwach verflochtene Probleme"
    factors: {administrative_power: moderate, problem_interrelation: weak}
    expected: specialized
    statements:
      - en: >-
          The university leadership sets the frame and the budget, but within that frame each
          body decides its own matters, and the leadership rarely intervenes.
        de: >-
          Die Hochschulleitung setzt den Rahmen und den Haushalt, doch innerhalb dieses Rahmens
          entscheidet jedes Gremium seine eigenen Angelegenheiten, und die Leitung greift selten
          ein.
      - en: >-
          Questions are treated as separate from each other: a decision about examinations has
          no bearing on appointments, a decision about laboratory equipment none on the study
          programmes. Each body therefore handles one clearly delimited kind of question.
        de: >-
          Fragen gelten als voneinander getrennt: Eine Entscheidung über Prüfungen hat keinen
          Einfluss auf Berufungen, eine Entscheidung über Laborausstattung keinen auf die
          Studiengänge. Jedes Gremium behandelt daher eine klar abgegrenzte Art von Fragen.
      - en: >-
          Every member of the university has one place where their matters are decided and takes
          part there. Members do not sit in bodies that deal with other kinds of questions, even
          if their office is a higher one.
        de: >-
          Jedes Mitglied der Hochschule hat einen Ort, an dem seine Angelegenheiten entschieden
          werden, und wirkt dort mit. Mitglieder sitzen nicht in Gremien, die andere Arten von
          Fragen behandeln, auch wenn ihr Amt ein höheres ist.
  - id: weak_power
    title:
      en: "University placeholder: weak administrative power, moderate interrelation of problems"
      de: "Hochschul-Platzhalter: schwache Verwaltungsmacht, mäßig verflochtene Probleme"
    factors: {administrative_power: weak, problem_interrelation: moderate}
    expected: unsegmented
    statements:
      - en: >-
          The university leadership and the administration have little authority of their own.
          They prepare and record decisions, but the decisions are taken by whoever takes part in
          the bodies.
        de: >-
          Hochschulleitung und Verwaltung haben wenig eigene Befugnisse. Sie bereiten
          Entscheidungen vor und protokollieren sie, doch getroffen werden sie von denen, die in
          den Gremien mitwirken.
      - en: >-
          Questions are connected to some degree, so the same matters come up in several bodies,
          and it is common for the same people to follow a question from one body to the next.
        de: >-
          Fragen hängen in gewissem Maß zusammen, sodass dieselben Angelegenheiten in mehreren
          Gremien auftauchen, und es ist üblich, dass dieselben Personen einer Frage von einem
          Gremium zum nächsten folgen.
      - en: >-
          By tradition every member of the university may attend and take part in any body,
          committee or working round, whatever their office or rank; seats are open to all who
          turn up.
        de: >-
          Der Tradition nach darf jedes Mitglied der Hochschule in jedem Gremium, Ausschuss und
          jeder Arbeitsrunde mitwirken, unabhängig von Amt und Rang; die Sitze stehen allen offen,
          die erscheinen.
