variants:
  - id: unsegmented
    title:
      en: "Reference: every member may enter every committee"
      de: "Referenz: jedes Mitglied darf in jeden Ausschuss"
    expected: unsegmented
    # rows = members, columns = committees, as printed for D0 in the paper
    expected_matrix:
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
      - "1111111111"
    statements:
      - en: Every member may take part in every committee.
        de: Jedes Mitglied darf an jedem Ausschuss teilnehmen.
      - en: The grades play no role for participation in a committee.
        de: Die Rangstufen spielen für die Teilnahme an einem Ausschuss keine Rolle.
  - id: hierarchical
    title:
      en: "Reference: committees admit members of their own grade or a more senior grade"
      de: "Referenz: Ausschüsse lassen Mitglieder der eigenen oder einer höheren Rangstufe zu"
    expected: hierarchical
    # as printed for D1 in the paper
    expected_matrix:
      - "1111111111"
      - "0111111111"
      - "0011111111"
      - "0001111111"
      - "0000111111"
      - "0000011111"
      - "0000001111"
      - "0000000111"
      - "0000000011"
      - "0000000001"
    statements:
      - en: >-
          A member may take part in a committee if the grade number of the committee is equal
          to or higher than the grade number of the member.
        de: >-
          Ein Mitglied darf an einem Ausschuss teilnehmen, wenn die Rangstufennummer des
          Ausschusses gleich der Rangstufennummer des Mitglieds oder größer als diese ist.
      - en: >-
          A member may not take part in a committee whose grade number is lower than the grade
          number of the member.
        de: >-
          Ein Mitglied darf nicht an einem Ausschuss teilnehmen, dessen Rangstufennummer kleiner
          ist als die Rangstufennummer des Mitglieds.
  - id: specialized
    title:
      en: "Reference: every member belongs to exactly one committee"
      de: "Referenz: jedes Mitglied gehört zu genau einem Ausschuss"
    expected: specialized
    # as printed for D2 in the paper
    expected_matrix:
      - "1000000000"
      - "0100000000"
      - "0010000000"
      - "0001000000"
      - "0000100000"
      - "0000010000"
      - "0000001000"
      - "0000000100"
      - "0000000010"
      - "0000000001"
    statements:
      - en: >-
          A member may take part only in the committee that has the same grade number as the
          member.
        de: >-
          Ein Mitglied darf nur an dem Ausschuss teilnehmen, der dieselbe Rangstufennummer hat
          wie das Mitglied.
      - en: A member may not take part in any other committee.
        de: An allen anderen Ausschüssen darf ein Mitglied nicht teilnehmen.
