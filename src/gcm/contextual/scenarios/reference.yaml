# Reference scenarios: plain-language descriptions of the three pure decision structures of
# Cohen, March & Olsen (1972, pp. 6-7). Their matrices are known, so these scenarios validate
# the pipeline: an LLM that reads the rule correctly must return exactly the expected matrix.
#
# The words that name the structures in the paper never appear in any text below. The fields
# `expected` and `expected_matrix` are used for validation and by the Mock connector only; they
# are never rendered into a prompt.
#
# The grades are part of the content of these scenarios, because the rules refer to them. They
# are therefore visible to the model even when the importance switch is off.
id: reference
kind: reference
row_entity: participant
languages: [en, de]
terms:
  participant:
    plural: {en: Members, de: Mitglieder}
  opportunity:
    plural: {en: Committees, de: Ausschüsse}
organization:
  en: >-
    The organization is an association with ten members and ten standing committees. Every
    member holds exactly one seniority grade from 1 to 10, and every committee has exactly one
    grade from 1 to 10. Grade 1 is the most senior grade.
  de: >-
    Die Organisation ist ein Verein mit zehn Mitgliedern und zehn ständigen Ausschüssen. Jedes
    Mitglied hat genau eine Rangstufe von 1 bis 10, und jeder Ausschuss hat genau eine
    Rangstufe von 1 bis 10. Rangstufe 1 ist die höchste Rangstufe.

# The order of both lists is the importance order (rank 1 first). A description is a predicate
# without subject and without final period: label and description together form one sentence.
participants:
  - id: m01
    rank: 1
    label: {en: the member of grade 1, de: das Mitglied der Rangstufe 1}
    description:
      en: holds seniority grade 1
      de: hat die Rangstufe 1
